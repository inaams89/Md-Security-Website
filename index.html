    @keyframes pulse-soft {

        transform: scale(1);
      }

      50% {
        opacity: 0.8;
        transform: scale(0.98);
      }
    }

    .animate-zoom {
      animation: slowZoom 30s ease-in-out infinite;
    }

    .animate-float {
      animation: float 6s ease-in-out infinite;
    }

    .animate-pulse-soft {

    }
